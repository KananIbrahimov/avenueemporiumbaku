<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AvenueBaku</title>
<meta name="theme-color" content="#0b0c0e">
<script src="ortak/tema-erken.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon/ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AvenueBaku">
<link rel="stylesheet" href="ortak/stil.css">
</head>
<body>
<header class="ust"><div class="kap">
  <a class="logo" href="./">AVENUE<small>BAKU</small></a>
  <nav id="ust-nav"></nav>
</div></header>
<main class="dar" style="max-width:560px">
  <!-- Əsas görünüş: yığcam siyahı -->
  <div id="ana-gorunus">
  <h1 data-t="ayarlar.baslik"></h1>

  <div class="bolum-baslik">👤 <span data-t="ayarlar.hesab"></span></div>
  <div id="hesab-ozet"><div class="kart"><p class="soluk" data-t="genel.yukleniyor"></p></div></div>

  <div class="bolum-baslik">🎨 <span data-t="ayarlar.gorunus"></span></div>
  <div class="kart" id="tema-bolum"></div>

  <div id="kilit-alan" hidden>
    <div class="bolum-baslik">🔐 <span data-t="kilit.baslik"></span></div>
    <div class="kart" id="kilit-bolum"></div>
  </div>

  <div id="diger-alan" hidden>
    <div class="bolum-baslik" data-t="ayarlar.diger"></div>
    <div class="kart menyu-kart">
      <a class="ayar-satir" href="siparislerim.html"><span>📦 <span data-t="nav.siparislerim"></span></span><span class="soluk">›</span></a>
      <a class="ayar-satir" href="begendiklerim.html"><span>♡ <span data-t="nav.begendiklerim"></span></span><span class="soluk">›</span></a>
    </div>
  </div>

  <div id="dil-alan" hidden>
    <div class="bolum-baslik" data-t="ayarlar.dil"></div>
    <div class="kart"><select id="dil-sec"></select></div>
  </div>

  </div>

  <!-- Hesab səhifəsi: ad, soyad, telefon, şifrə -->
  <div id="hesab-gorunus" hidden>
    <div class="bolum-ust" style="margin-top:6px">
      <h1 style="margin:0">👤 <span data-t="ayarlar.hesab"></span></h1>
      <a class="btn btn-ince btn-kucuk" href="#" id="hesab-geri">← <span data-t="ayarlar.baslik"></span></a>
    </div>
    <div class="kart" id="hesab-bolum"></div>
    <div class="bolum-baslik">🔒 <span data-t="ayarlar.sifre"></span></div>
      <form class="kart" id="sifre-form" novalidate>
        <div class="alan"><label for="s-hazirki" data-t="ayarlar.sifreHazirki"></label>
          <input id="s-hazirki" type="password" autocomplete="current-password"></div>
        <div class="alan"><label for="s-yeni" data-t="ayarlar.sifreYeni"></label>
          <input id="s-yeni" type="password" autocomplete="new-password">
          <div class="ipucu" data-t="sifre.kurallar"></div></div>
        <div class="alan"><label for="s-yeni2" data-t="ayarlar.sifreYeni2"></label>
          <input id="s-yeni2" type="password" autocomplete="new-password"></div>
        <button class="btn" type="submit" data-t="ayarlar.sifreDeyis"></button>
      </form>
  </div>

  <button type="button" class="btn btn-ince btn-tam cixis-btn" id="cixis" hidden>⎋ <span data-t="nav.cikis"></span></button>
  <div id="imza"></div>
</main>
<script type="module" src="js/ayarlar.js"></script>
</body>
</html>
