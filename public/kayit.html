<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AvenueBaku</title>
<meta name="theme-color" content="#0b0c0e">
<script src="ortak/tema-erken.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon/ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AvenueBaku">
<link rel="stylesheet" href="ortak/stil.css">
</head>
<body>
<header class="ust"><div class="kap">
  <a class="logo" href="./">AVENUE<small>BAKU</small></a>
  <nav id="ust-nav"></nav>
</div></header>
<main class="dar">
  <div class="kart">
    <h1 data-t="kayit.baslik"></h1>
    <p class="soluk" data-t="kayit.alt"></p>
    <div id="mesaj"></div>
    <form id="form" novalidate>
      <div class="satir">
        <div class="alan"><label for="ad" data-t="alan.ad"></label><input id="ad" autocomplete="given-name" maxlength="50" required></div>
        <div class="alan"><label for="soyad" data-t="alan.soyad"></label><input id="soyad" autocomplete="family-name" maxlength="50" required></div>
      </div>
      <div class="alan"><label for="email" data-t="alan.email"></label><input id="email" type="email" autocomplete="email" data-t-ph="alan.emailOrnek" required></div>
      <div class="alan"><label for="sifre" data-t="alan.sifre"></label><input id="sifre" type="password" autocomplete="new-password" required>
        <div class="ipucu" data-t="sifre.kurallar"></div></div>
      <div class="alan"><label for="sifre2" data-t="alan.sifreTekrar"></label><input id="sifre2" type="password" autocomplete="new-password" required></div>
      <div class="alan razilasma" id="razilasma-alan">
        <input id="razilasma" type="checkbox" required>
        <label for="razilasma" id="razilasma-metin"></label>
      </div>
      <button class="btn btn-tam" type="submit" data-t="kayit.buton"></button>
    </form>
    <p class="soluk" style="text-align:center;margin-top:16px"><span data-t="kayit.hesapVar"></span> <a href="giris.html" data-t="nav.giris"></a></p>
  </div>
</main>
<script type="module" src="js/hesab.js"></script>
</body>
</html>
