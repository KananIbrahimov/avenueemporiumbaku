<script>
  // E-poçtdakı keçid başqa cihazda açılsa da, müştəri qeydiyyat zamanı hansı dili seçibsə səhifə o dildə açılsın.
  // Dil "continueUrl" içində gəlir: .../giris.html?dil=ru
  try {
    var q = new URLSearchParams(location.search);
    var d = new URL(q.get("continueUrl") || "", location.origin).searchParams.get("dil") || q.get("lang");
    if (/^[a-z]{2}$/.test(d || "")) localStorage.setItem("dil", d); // tanınmayan kod i18n.js-də nəzərə alınmır
  } catch (e) {}
</script>
